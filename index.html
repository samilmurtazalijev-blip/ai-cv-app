<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CV Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --accent:#5b5ce2;
  --font:Inter,Arial,sans-serif;
  --line:1.5;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:linear-gradient(135deg,#6a5cff,#d94fd5);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:var(--font);
}

.app{
  width:1200px;
  max-width:95%;
  background:#fff;
  border-radius:20px;
  padding:24px;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:24px;
}

/* LEFT */
.panel h2{margin-top:0}
.panel input,.panel textarea,.panel select{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
}
.panel label{font-size:13px;color:#555;margin-top:12px;display:block}

.btn{
  margin-top:14px;
  padding:12px;
  width:100%;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

/* CONTROLS */
.row{display:flex;gap:8px;flex-wrap:wrap}
.small-btn{
  padding:6px 10px;
  font-size:12px;
  border-radius:8px;
  border:1px solid #ccc;
  cursor:pointer;
}

/* PREVIEW */
.preview-wrap{
  background:#f5f6fa;
  border-radius:16px;
  padding:20px;
  position:relative;
}
.preview{
  background:#fff;
  padding:30px;
  border-radius:12px;
  min-height:600px;
  line-height:var(--line);
}
.mobile{max-width:390px;margin:auto}

/* SECTIONS */
.section{
  margin-top:20px;
}
.section h3{
  color:var(--accent);
  margin-bottom:6px;
}
.section[draggable]{cursor:grab}

/* PAYWALL */
.paywall{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.95);
  display:flex;
  align-items:center;
  justify-content:center;
}
.paybox{
  text-align:center;
  background:#fff;
  padding:30px;
  border-radius:16px;
}
.paybox a{
  display:block;
  margin-top:12px;
  padding:14px;
  background:#22a958;
  color:#fff;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<!-- LEFT PANEL -->
<div class="panel">
  <h2>CV Controls</h2>

  <label>Name</label>
  <input id="name" oninput="update()">

  <label>Role</label>
  <input id="role" oninput="update()">

  <label>Summary</label>
  <textarea id="summary" oninput="update()"></textarea>
  <small id="summaryCount"></small>

  <label>Keywords (comma separated)</label>
  <input id="keywords" oninput="highlight()">

  <label>Font</label>
  <select onchange="setFont(this.value)">
    <option>Inter</option>
    <option>Arial</option>
    <option>Calibri</option>
    <option>Georgia</option>
  </select>

  <label>Line spacing</label>
  <input type="range" min="1.2" max="2" step="0.1" value="1.5" oninput="setSpacing(this.value)">

  <div class="row">
    <button class="small-btn" onclick="toggle('skills')">Toggle Skills</button>
    <button class="small-btn" onclick="toggle('exp')">Toggle Experience</button>
    <button class="small-btn" onclick="toggle('edu')">Toggle Education</button>
  </div>

  <div class="row">
    <button class="small-btn" onclick="undo()">Undo</button>
    <button class="small-btn" onclick="redo()">Redo</button>
    <button class="small-btn" onclick="toggleMobile()">Mobile</button>
  </div>

  <button class="btn" onclick="pay()">Download PDF / DOCX</button>
</div>

<!-- PREVIEW -->
<div class="preview-wrap">
  <div id="preview" class="preview" oninput="saveState()">

    <h2 contenteditable id="pName">John Doe</h2>
    <p contenteditable id="pRole">Product Designer</p>

    <div class="section" draggable id="summarySec">
      <h3>Summary</h3>
      <p contenteditable id="pSummary">Write a short professional summary.</p>
    </div>

    <div class="section" draggable id="exp">
      <h3>Experience</h3>
      <p contenteditable>5+ years experience.</p>
    </div>

    <div class="section" draggable id="skills">
      <h3>Skills</h3>
      <p contenteditable>React, UX, Figma</p>
    </div>

    <div class="section" draggable id="edu">
      <h3>Education</h3>
      <p contenteditable>Bachelor Degree</p>
    </div>

  </div>

  <div class="paywall">
    <div class="paybox">
      <h3>Export your CV</h3>
      <p>PDF & Word</p>
      <a href="https://buy.stripe.com/test_6oUcN7ehggXX5gEgyv3oA00">
        Export → €3.99
      </a>
    </div>
  </div>
</div>

</div>

<script>
let history=[],future=[];
const preview=document.getElementById("preview");

function update(){
  pName.innerText=name.value||"John Doe";
  pRole.innerText=role.value||"Your role";
  pSummary.innerText=summary.value||"Summary";
  summaryCount.innerText=summary.value.length+" / 400";
  saveState();
}

function setFont(f){document.documentElement.style.setProperty("--font",f)}
function setSpacing(v){document.documentElement.style.setProperty("--line",v)}

function toggle(id){
  const el=document.getElementById(id);
  el.style.display=el.style.display==="none"?"block":"none";
  saveState();
}

function toggleMobile(){
  preview.classList.toggle("mobile");
}

function saveState(){
  history.push(preview.innerHTML);
  localStorage.cv=preview.innerHTML;
}

function undo(){
  if(history.length>1){
    future.push(history.pop());
    preview.innerHTML=history[history.length-1];
  }
}
function redo(){
  if(future.length){
    preview.innerHTML=future.pop();
  }
}

function highlight(){
  const keys=keywords.value.split(",").map(k=>k.trim());
  let html=preview.innerHTML;
  keys.forEach(k=>{
    if(k) html=html.replaceAll(k,`<mark>${k}</mark>`);
  });
  preview.innerHTML=html;
}

function pay(){
  window.location.href="https://buy.stripe.com/test_6oUcN7ehggXX5gEgyv3oA00";
}

/* Load saved */
if(localStorage.cv){
  preview.innerHTML=localStorage.cv;
}
</script>

</body>
</html>
