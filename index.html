
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AI CV Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root {
  --accent:#5b5ce2;
  --bg:#ffffff;
  --text:#111;
}

*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#6a5cff,#d94fd5);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* CARD */
.app{
  background:#fff;
  width:1100px;
  max-width:95%;
  border-radius:22px;
  padding:30px;
  display:grid;
  grid-template-columns:380px 1fr;
  gap:30px;
}

/* LEFT */
.sidebar h1{margin:0}
.sidebar p{color:#666}
.sidebar input,
.sidebar textarea{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  border:1px solid #ddd;
}
.sidebar textarea{min-height:120px}
.sidebar button{
  margin-top:20px;
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* CONTROLS */
.controls{margin-top:25px}
.controls h4{margin:15px 0 8px}
.templates,.colors{
  display:flex;
  gap:10px;
}
.template,.color{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #ddd;
  cursor:pointer;
  font-size:13px;
}
.template.locked,.color.locked{
  opacity:.5;
  position:relative;
}
.template.locked::after,
.color.locked::after{
  content:"🔒";
  position:absolute;
  top:-8px;
  right:-8px;
  background:#000;
  color:#fff;
  font-size:11px;
  padding:3px 6px;
  border-radius:20px;
}

/* PREVIEW */
.preview-wrap{
  background:#f5f6fa;
  border-radius:18px;
  padding:25px;
  position:relative;
  overflow:hidden;
}
.preview{
  background:var(--bg);
  color:var(--text);
  border-radius:16px;
  padding:30px;
  min-height:500px;
}
.preview.blur{
  filter:blur(6px);
  user-select:none;
}

/* CV STYLES */
.cv h2{margin:0}
.cv .role{color:var(--accent);font-weight:600}
.cv section{margin-top:20px}

/* TEMPLATES */
.template-modern{font-size:15px}
.template-classic{font-family:Georgia,serif}
.template-creative h2{font-size:28px}

/* PAYWALL */
.paywall{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.92);
  display:flex;
  align-items:center;
  justify-content:center;
}
.paybox{
  background:#fff;
  padding:30px;
  border-radius:18px;
  text-align:center;
  max-width:320px;
}
.paybox a{
  display:block;
  margin-top:15px;
  padding:14px;
  background:#22a958;
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-weight:600;
}

/* RESPONSIVE */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<!-- LEFT -->
<div class="sidebar">
  <h1>AI CV Builder</h1>
  <p>Create a modern, ATS-friendly CV</p>

  <input id="name" placeholder="Full name">
  <input id="role" placeholder="Profession">
  <textarea id="exp" placeholder="Experience"></textarea>

  <button onclick="generate()">Generate CV</button>

  <div class="controls">
    <h4>Templates</h4>
    <div class="templates">
      <div class="template" onclick="setTemplate('modern')">Modern</div>
      <div class="template locked" onclick="locked()">Classic</div>
      <div class="template locked" onclick="locked()">Creative</div>
    </div>

    <h4>Colors</h4>
    <div class="colors">
      <div class="color" style="background:#5b5ce2" onclick="setColor('#5b5ce2')"></div>
      <div class="color locked" style="background:#22a958" onclick="locked()"></div>
      <div class="color locked" style="background:#000" onclick="locked()"></div>
    </div>
  </div>
</div>

<!-- RIGHT -->
<div class="preview-wrap">
  <div id="preview" class="preview blur template-modern cv">
    <h2 id="pName">John Doe</h2>
    <div class="role" id="pRole">Product Designer</div>

    <section>
      <h3>Experience</h3>
      <p id="pExp">5+ years designing user-centered products.</p>
    </section>
  </div>

  <div class="paywall" id="paywall">
    <div class="paybox">
      <h3>Unlock full CV</h3>
      <p>Templates • Colors • PDF export</p>

      <!-- 🔥 TAVO STRIPE LINKAS -->
      <a href="https://buy.stripe.com/test_6oUcN7ehggXX5gEgyv3oA00">
        Unlock → €3.99
      </a>

      <small>No subscription</small>
    </div>
  </div>
</div>

</div>

<script>
let unlocked=false;

function generate(){
  document.getElementById("pName").innerText=
    name.value||"Your Name";
  document.getElementById("pRole").innerText=
    role.value||"Your Profession";
  document.getElementById("pExp").innerText=
    exp.value||"Your experience here.";
}

function setTemplate(t){
  if(!unlocked)return locked();
  preview.className=`preview template-${t} cv`;
}

function setColor(c){
  if(!unlocked)return locked();
  document.documentElement.style.setProperty("--accent",c);
}

function locked(){
  alert("Unlock premium features to customize design");
}

/* DEV ONLY – simulate unlock */
document.addEventListener("keydown",e=>{
  if(e.key==="u"){
    unlocked=true;
    preview.classList.remove("blur");
    document.getElementById("paywall").style.display="none";
  }
});
</script>

</body>
</html>
